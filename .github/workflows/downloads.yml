name: Sync stable downloads
on:
  release:
    types: [published, released, edited, unpublished, deleted]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable product tag to promote (blank only reconciles existing entries)
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: stable-download-catalog
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node release-metadata/sync-downloads.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
